<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orden Confirmada — RudeStyle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; color: #fff; }
        .card-custom { background-color: #1c1c1c; border: 1px solid #333; border-radius: 12px; }
        .text-gold { color: #d4af37; }
        .btn-gold { background-color: #d4af37; color: #000; font-weight: bold; }
    </style>
</head>
<body>
<div class="container py-5 text-center" style="max-width: 650px;">
    <div class="card card-custom p-4">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
        <h2 class="text-gold fw-bold mt-2">¡Pedido Confirmado con Éxito!</h2>
        <p class="text-secondary">Código de Orden: <strong class="text-white" th:text="${pedido.codigoOrden}">RUDE-XXXXXXXX</strong></p>

        <div class="bg-black p-3 rounded text-start my-3 border border-secondary">
            <div class="d-flex justify-content-between mb-1">
                <span>Subtotal Prendas:</span>
                <span th:text="'S/ ' + ${pedido.subtotal}"></span>
            </div>
            <div class="d-flex justify-content-between mb-1">
                <span>Costo Envío:</span>
                <span th:text="'S/ ' + ${pedido.costoEnvio}"></span>
            </div>
            <div class="d-flex justify-content-between mb-1 text-info" th:if="${pedido.montoAdelanto > 0}">
                <span>Adelanto Delivery Pagado:</span>
                <span th:text="'S/ ' + ${pedido.montoAdelanto}"></span>
            </div>
            <hr class="border-secondary my-2">
            <div class="d-flex justify-content-between fw-bold text-gold fs-5">
                <span>Saldo a Pagar al Recibir:</span>
                <span th:text="'S/ ' + ${pedido.saldoContraentrega}"></span>
            </div>
        </div>

        <p class="small text-secondary">Recibirás tu pedido en <strong th:text="${pedido.direccionEnvio}"></strong>. El repartidor cobrará únicamente el saldo pendiente.</p>
        <a th:href="@{/catalogo}" class="btn btn-gold mt-3">Seguir Comprando</a>
    </div>
</div>
</body>
</html>
