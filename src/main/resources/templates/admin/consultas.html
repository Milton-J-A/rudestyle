<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-black text-light">

  <div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

  <main class="container-fluid px-4 py-4" style="min-height: 80vh;">
    <div class="mb-4">
      <div class="text-warning text-uppercase small fw-bold" style="letter-spacing: 2px;">
        <i class="bi bi-search me-1"></i> Búsqueda Rápida
      </div>
      <h2 class="text-light fw-black mb-0">CONSULTAS DE CLIENTES & PEDIDOS</h2>
    </div>

    <!-- Caja de Búsqueda -->
    <div class="bg-dark p-4 rounded border border-secondary border-opacity-25 mb-4" style="max-width: 800px;">
      <form th:action="@{/admin/consultas}" method="get" class="row g-2">
        <div class="col-sm-9">
          <input type="text" name="busqueda" class="form-control bg-black text-light border-secondary" 
                 placeholder="Ingrese DNI / Teléfono / Nombre del cliente / Código de orden..." 
                 th:value="${busqueda}">
        </div>
        <div class="col-sm-3">
          <button type="submit" class="btn btn-warning text-black fw-bold w-100">
            <i class="bi bi-search me-1"></i> Consultar
          </button>
        </div>
      </form>
    </div>

    <!-- Resultados -->
    <div th:if="${not #strings.isEmpty(busqueda)}">
      <div th:if="${#lists.isEmpty(pedidos)}" class="bg-dark p-4 rounded border border-secondary border-opacity-25 text-center">
        <i class="bi bi-person-x text-secondary" style="font-size: 2.5rem;"></i>
        <h5 class="text-light mt-2">No se encontraron resultados</h5>
        <p class="text-secondary small mb-0">Verifique el dato ingresado y vuelva a intentar.</p>
      </div>

      <div th:unless="${#lists.isEmpty(pedidos)}" class="bg-dark p-3 rounded border border-secondary border-opacity-25 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-warning small fw-bold text-uppercase">Resultados Encontrados</span>
          <span class="badge bg-secondary" th:text="${#lists.size(pedidos)} + ' compras'"></span>
        </div>

        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle mb-0">
            <thead>
              <tr class="text-secondary small text-uppercase border-secondary">
                <th>Código</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Contacto</th>
                <th>Total</th>
                <th>Estado</th>
                <th class="text-end">Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${pedidos}" class="border-secondary small">
                <td class="text-warning fw-bold" th:text="${p.codigoOrden}"></td>
                <td class="text-secondary" th:text="${#temporals.format(p.fechaPedido, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                  <span class="text-light fw-bold d-block" th:text="${p.nombresCliente}"></span>
                  <small class="text-muted" th:text="${p.direccionEnvio + ' (' + p.departamento + ')'}"></small>
                </td>
                <td>
                  <small class="d-block text-secondary" th:text="${p.correoCliente}"></small>
                  <small class="text-secondary" th:text="${p.telefonoCliente}"></small>
                </td>
                <td class="text-warning fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(p.total, 1, 2)}"></td>
                <td>
                  <span th:class="${p.estadoPago == 'COMPLETADO' ? 'badge bg-success' : 
                                   (p.estadoPago == 'CANCELADO' ? 'badge bg-danger' : 'badge bg-warning text-dark')}"
                        th:text="${p.estadoPago}"></span>
                </td>
                <td class="text-end">
                  <a th:href="@{'/admin/pedidos/detalle/' + ${p.idPedido}}" class="btn btn-outline-warning btn-sm py-1 px-3">
                    <i class="bi bi-eye me-1"></i> Ver Prendas
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
