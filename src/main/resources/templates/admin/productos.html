<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-black text-light">

  <!-- Navbar dedicado del Administrador -->
  <div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

  <div class="container-fluid px-4 py-4" style="min-height: 85vh;">
    
    <!-- Encabezado de la página -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <div class="text-warning text-uppercase small fw-bold" style="letter-spacing: 2px;">
          <i class="bi bi-gear-fill me-1"></i> Mantenimiento de Catálogo
        </div>
        <h2 class="text-light fw-black mb-0">PRODUCTOS & PRENDAS</h2>
      </div>
      <a th:if="${esEdicion}" th:href="@{/admin/productos}" class="btn btn-outline-warning btn-sm">
        <i class="bi bi-plus-circle me-1"></i> Registrar Nueva Prenda
      </a>
    </div>

    <!-- Mensajes Flash de Retroalimentación (Rúbrica UX) -->
    <div th:if="${success != null}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 mb-3 bg-opacity-25 bg-success text-success border border-success" role="alert">
      <i class="bi bi-check-circle-fill"></i>
      <span th:text="${success}"></span>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-3 bg-opacity-25 bg-danger text-danger border border-danger" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span th:text="${error}"></span>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Layout en 2 Columnas -->
    <div class="row g-4">
      
      <!-- Columna Izquierda: Formulario (Nuevo / Editar Producto) -->
      <div class="col-lg-4 col-xl-3">
        <div class="bg-dark p-3 rounded border border-secondary border-opacity-25 shadow-sm sticky-top" style="top: 80px;">
          <div class="text-warning text-uppercase small fw-bold mb-3 d-flex align-items-center gap-2">
            <i class="bi" th:classappend="${esEdicion ? 'bi-pencil-square' : 'bi-plus-circle'}"></i>
            <span th:text="${esEdicion ? 'Editar Producto #' + producto.idProducto : 'Nuevo Producto'}"></span>
          </div>

          <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post">
            <input type="hidden" th:field="*{idProducto}">

            <!-- Vista previa de imagen si está en edición -->
            <div th:if="${esEdicion and producto.imagen != null and !#strings.isEmpty(producto.imagen)}" class="text-center mb-3 p-2 bg-black rounded border border-secondary border-opacity-25">
              <small class="text-secondary d-block mb-1" style="font-size: 0.72rem;">IMAGEN ACTUAL</small>
              <img th:src="@{'/img/' + ${producto.imagen}}" 
                   alt="Preview" 
                   class="img-fluid rounded" 
                   style="max-height: 90px; object-fit: contain;"
                   onerror="this.src='/img/no-image.png'">
            </div>

            <div class="mb-3">
              <label class="form-label text-secondary small mb-1">Nombre de la Prenda *</label>
              <input type="text" th:field="*{nomProducto}" class="form-control bg-black text-light border-secondary small" 
                     placeholder="Ej: Polera Oversize Rude Black" required>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label text-secondary small mb-1">Precio (S/.) *</label>
                <input type="number" step="0.01" min="0.01" th:field="*{precio}" class="form-control bg-black text-light border-secondary small" 
                       placeholder="0.00" required>
              </div>
              <div class="col-6">
                <label class="form-label text-secondary small mb-1">Stock Actual *</label>
                <input type="number" min="0" th:field="*{stock}" class="form-control bg-black text-light border-secondary small" 
                       placeholder="0" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label text-secondary small mb-1">Categoría *</label>
              <select th:field="*{categoria}" class="form-select bg-black text-light border-secondary small" required>
                <option value="">-- Seleccione Categoría --</option>
                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nomCategoria}"></option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label text-secondary small mb-1">Tallas Disponibles</label>
              <input type="text" th:field="*{tallasDisponibles}" class="form-control bg-black text-light border-secondary small" 
                     placeholder="Ej: S, M, L, XL">
            </div>

            <div class="mb-3">
              <label class="form-label text-secondary small mb-1">Archivo de Imagen</label>
              <input type="text" th:field="*{imagen}" class="form-control bg-black text-light border-secondary small" 
                     placeholder="Ej: polera-rude.jpg">
              <small class="text-secondary" style="font-size: 0.7rem;">Ubicado en static/img/</small>
            </div>

            <div class="mb-3">
              <label class="form-label text-secondary small mb-1">Descripción</label>
              <textarea th:field="*{descripcion}" class="form-control bg-black text-light border-secondary small" 
                        rows="2" placeholder="Detalles de tela, corte y acabado..."></textarea>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" th:field="*{destacado}" id="checkDest">
              <label class="form-check-label text-secondary small" for="checkDest">Marcar como Prenda Destacada</label>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-warning text-black fw-bold w-100 py-2 text-uppercase small">
                <i class="bi bi-check-lg me-1"></i> Guardar
              </button>
              <a th:if="${esEdicion}" th:href="@{/admin/productos}" class="btn btn-outline-secondary py-2 small">
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>

      <!-- Columna Derecha: Tabla Lista de Productos -->
      <div class="col-lg-8 col-xl-9">
        <div class="bg-dark p-3 rounded border border-secondary border-opacity-25 shadow-sm">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="text-warning text-uppercase small fw-bold d-flex align-items-center gap-2">
              <i class="bi bi-list-ul"></i> Inventario de Catálogo
            </div>
            <span class="badge bg-black border border-secondary text-secondary small fw-bold" th:text="${totalRegistros} + ' PRENDAS REGISTRADAS'"></span>
          </div>

          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0">
              <thead>
                <tr class="text-secondary small text-uppercase border-secondary">
                  <th style="width: 50px;">ID</th>
                  <th style="width: 60px;">Foto</th>
                  <th>Prenda</th>
                  <th>Categoría</th>
                  <th>Precio</th>
                  <th class="text-center">Stock</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="p : ${productos}" class="border-secondary small">
                  <td class="text-secondary" th:text="'#' + ${p.idProducto}"></td>
                  <td>
                    <!-- Miniatura de imagen con fallback -->
                    <img th:src="@{'/img/' + ${p.imagen != null and !#strings.isEmpty(p.imagen) ? p.imagen : 'no-image.png'}}" 
                         alt="Foto" 
                         class="rounded border border-secondary border-opacity-50"
                         style="width: 38px; height: 38px; object-fit: cover;"
                         onerror="this.src='https://placehold.co/40x40/222/c9a227?text=Rude'">
                  </td>
                  <td>
                    <span class="text-light fw-bold d-block" th:text="${p.nomProducto}"></span>
                    <span th:if="${p.destacado}" class="badge bg-warning text-dark fw-bold" style="font-size: 0.65rem;">DESTACADO</span>
                  </td>
                  <td>
                    <span class="badge bg-black border border-secondary text-secondary" 
                          th:text="${p.categoria != null ? p.categoria.nomCategoria : 'Sin Asignar'}"></span>
                  </td>
                  <td class="text-warning fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                  <td class="text-center">
                    <!-- Semáforo de Stock -->
                    <span th:if="${p.stock == 0}" class="badge bg-danger-subtle text-danger border border-danger px-2 py-1">Agotado</span>
                    <span th:if="${p.stock > 0 and p.stock <= 5}" class="badge bg-warning-subtle text-warning border border-warning px-2 py-1" th:text="${p.stock} + ' (Bajo)'"></span>
                    <span th:if="${p.stock > 5}" class="badge bg-success-subtle text-success border border-success px-2 py-1" th:text="${p.stock} + ' un.'"></span>
                  </td>
                  <td class="text-end">
                    <div class="d-inline-flex gap-1">
                      <a th:href="@{'/admin/productos/editar/' + ${p.idProducto}}" class="btn btn-outline-warning btn-sm py-1 px-2" title="Editar Prenda">
                        <i class="bi bi-pencil-square"></i>
                      </a>
                      <a th:href="@{'/admin/productos/eliminar/' + ${p.idProducto}}" 
                         class="btn btn-outline-danger btn-sm py-1 px-2" 
                         onclick="return confirm('¿Confirmas eliminar esta prenda del catálogo?');" 
                         title="Eliminar Prenda">
                        <i class="bi bi-trash3"></i>
                      </a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <!-- Script Bootstrap para alertas y tooltips -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
