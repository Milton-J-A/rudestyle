<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-black text-light">

  <div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

  <main class="container-fluid px-4 py-4" style="min-height: 85vh;">
    <!-- Encabezado con Botón de Descarga Excel -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <div class="text-warning text-uppercase small fw-bold" style="letter-spacing: 2px;">
          <i class="bi bi-graph-up-arrow me-1"></i> Análisis & Balance
        </div>
        <h2 class="text-light fw-black mb-0">REPORTES DE VENTAS DEL DÍA</h2>
      </div>
      <div class="d-flex align-items-center gap-2">
        <a th:href="@{/admin/reportes/descargar-csv}" class="btn btn-warning text-black fw-bold btn-sm py-2 px-3 d-flex align-items-center gap-2 shadow-sm">
          <i class="bi bi-file-earmark-excel"></i> Descargar Reporte (Excel)
        </a>
        <span class="badge bg-dark border border-secondary text-secondary px-3 py-2 small" 
              th:text="'Fecha: ' + ${#temporals.format(fechaHoy, 'dd/MM/yyyy')}"></span>
      </div>
    </div>

    <!-- Tarjetas de Métricas (KPIs) -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="bg-dark p-3 rounded border border-secondary border-opacity-25">
          <span class="text-secondary small text-uppercase fw-semibold">Ingresos del Día</span>
          <h3 class="text-warning fw-black mt-2 mb-0" th:text="'S/ ' + ${#numbers.formatDecimal(totalIngresosHoy, 1, 2)}"></h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="bg-dark p-3 rounded border border-secondary border-opacity-25">
          <span class="text-secondary small text-uppercase fw-semibold">Órdenes Generadas</span>
          <h3 class="text-light fw-black mt-2 mb-0" th:text="${totalVentasHoy}"></h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="bg-dark p-3 rounded border border-secondary border-opacity-25">
          <span class="text-secondary small text-uppercase fw-semibold">Clientes Únicos</span>
          <h3 class="text-light fw-black mt-2 mb-0" th:text="${totalClientesCompradores}"></h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="bg-dark p-3 rounded border border-secondary border-opacity-25">
          <span class="text-secondary small text-uppercase fw-semibold">Ticket Promedio</span>
          <h3 class="text-light fw-black mt-2 mb-0" th:text="'S/ ' + ${#numbers.formatDecimal(ticketPromedio, 1, 2)}"></h3>
        </div>
      </div>
    </div>

    <!-- Detalle de Transacciones del Día -->
    <div class="bg-dark p-3 rounded border border-secondary border-opacity-25 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="text-warning text-uppercase small fw-bold d-flex align-items-center gap-2">
          <i class="bi bi-table"></i> Detalle de Ventas e Ingresos por Cliente
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead>
            <tr class="text-secondary small text-uppercase border-secondary">
              <th>Código</th>
              <th>Hora</th>
              <th>Cliente</th>
              <th>Método Pago</th>
              <th>Monto Abonado</th>
              <th>Estado</th>
              <th class="text-end">Comprobante</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(pedidosHoy)}">
              <td colspan="7" class="text-center py-4 text-secondary">No se registran transacciones el día de hoy.</td>
            </tr>
            <tr th:each="p : ${pedidosHoy}" class="border-secondary small">
              <td class="text-warning fw-bold" th:text="${p.codigoOrden}"></td>
              <td class="text-secondary" th:text="${#temporals.format(p.fechaPedido, 'HH:mm')}"></td>
              <td>
                <span class="text-light fw-bold d-block" th:text="${p.nombresCliente}"></span>
                <small class="text-secondary" th:text="${p.correoCliente}"></small>
              </td>
              <td class="text-secondary" th:text="${p.metodoPago}"></td>
              <td class="text-warning fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(p.total, 1, 2)}"></td>
              <td>
                <span th:class="${p.estadoPago == 'COMPLETADO' ? 'badge bg-success' : 
                                 (p.estadoPago == 'CANCELADO' ? 'badge bg-danger' : 'badge bg-warning text-dark')}"
                      th:text="${p.estadoPago}"></span>
              </td>
              <td class="text-end">
                <a th:href="@{'/admin/pedidos/detalle/' + ${p.idPedido}}" class="btn btn-outline-secondary btn-sm py-1 px-3">
                  <i class="bi bi-receipt me-1"></i> Ver
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
