<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container my-5 d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="bg-dark p-5 rounded border border-secondary border-opacity-25 text-center" style="max-width: 520px; width: 100%;">
      <i class="bi bi-check-circle-fill text-warning" style="font-size: 4rem;"></i>
      <h2 class="text-light fw-bold mt-3">¡Orden Confirmada!</h2>
      <p class="text-secondary">Gracias por tu compra, <span class="text-light fw-bold" th:text="${cliente}"></span>.</p>
      
      <div class="bg-black p-3 rounded border border-secondary border-opacity-50 my-4 text-start">
        <div class="d-flex justify-content-between mb-2">
          <span class="text-secondary small">Código de Orden:</span>
          <span class="text-warning fw-bold small" th:text="${codigoOrden}"></span>
        </div>
        <div class="d-flex justify-content-between">
          <span class="text-secondary small">Total Abonado:</span>
          <span class="text-light fw-bold small" th:text="'S/. ' + ${#numbers.formatDecimal(total, 1, 2)}"></span>
        </div>
      </div>

      <a th:href="@{/catalogo}" class="rs-btn-primary d-inline-block text-decoration-none">Seguir Explorando</a>
    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
