<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

  <main class="container my-5" style="min-height: 70vh;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <div class="rs-section-title">Gestión de Ventas</div>
        <h2 class="rs-section-h2">Órdenes de Compra</h2>
      </div>
      <div class="d-flex align-items-center gap-2">
        <a th:href="@{/admin/productos}" class="rs-btn-outline py-2 px-3 text-decoration-none d-flex align-items-center gap-1">
          <i class="bi bi-box-seam"></i> Gestionar Productos
        </a>
        <span class="badge bg-warning text-dark px-3 py-2 fw-bold d-flex align-items-center">Panel Administrativo</span>
      </div>
    </div>

    <div class="table-responsive bg-dark p-3 rounded border border-secondary border-opacity-25">
      <table class="table table-dark table-hover align-middle mb-0">
        <thead>
          <tr class="text-secondary border-secondary">
            <th>Código</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Contacto</th>
            <th>Total</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="ped : ${pedidos}" class="border-secondary">
            <td>
              <span class="fw-bold text-warning" th:text="${ped.codigoOrden}"></span>
            </td>
            <td class="text-secondary small" th:text="${#temporals.format(ped.fechaPedido, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <span class="text-light fw-bold d-block" th:text="${ped.nombresCliente}"></span>
              <small class="text-muted" th:text="${ped.direccionEnvio + ' (' + ped.departamento + ')'}"></small>
            </td>
            <td>
              <small class="d-block text-secondary" th:text="${ped.correoCliente}"></small>
              <small class="text-secondary" th:text="${ped.telefonoCliente}"></small>
            </td>
            <td class="text-warning fw-bold" th:text="'S/. ' + ${#numbers.formatDecimal(ped.total, 1, 2)}"></td>
            <td>
              <!-- Formulario rápido para actualizar estado -->
              <form th:action="@{/admin/pedidos/actualizar-estado}" method="post" class="d-inline-flex gap-2">
                <input type="hidden" name="idPedido" th:value="${ped.idPedido}">
                <select name="nuevoEstado" class="form-select form-select-sm bg-black text-light border-secondary" onchange="this.form.submit()">
                  <option value="PENDIENTE" th:selected="${ped.estadoPago == 'PENDIENTE'}">Pendiente</option>
                  <option value="EN PROCESO" th:selected="${ped.estadoPago == 'EN PROCESO'}">En Proceso</option>
                  <option value="COMPLETADO" th:selected="${ped.estadoPago == 'COMPLETADO'}">Completado</option>
                  <option value="ENTREGADO" th:selected="${ped.estadoPago == 'ENTREGADO'}">Entregado</option>
                  <option value="CANCELADO" th:selected="${ped.estadoPago == 'CANCELADO'}">Cancelado</option>
                </select>
              </form>
            </td>
            <td class="text-end">
              <a th:href="@{'/admin/pedidos/detalle/' + ${ped.idPedido}}" class="rs-btn-outline py-1 px-3 small text-decoration-none">
                <i class="bi bi-eye"></i> Detalle
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
