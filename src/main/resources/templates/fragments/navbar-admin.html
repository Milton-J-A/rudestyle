<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="navbar-admin" class="sticky-top bg-black border-bottom border-secondary border-opacity-25 py-2 px-4">
    <div class="d-flex justify-content-between align-items-center">
      <!-- Menú Izquierdo -->
      <div class="d-flex align-items-center gap-4">
        <a class="text-decoration-none d-flex align-items-center" th:href="@{/admin/productos}">
          <span class="text-light fw-black fs-5">RUDE</span><span class="text-warning fw-black fs-5">STYLE</span>
          <span class="badge bg-warning text-black ms-2 fw-bold" style="font-size: 0.65rem;">ADMIN</span>
        </a>

        <nav class="d-flex align-items-center gap-3">
          <!-- Dropdown Mantenimientos -->
          <div class="dropdown">
            <a class="nav-link text-secondary dropdown-toggle small text-uppercase fw-semibold" href="#" role="button" data-bs-toggle="dropdown">
              <i class="bi bi-gear me-1"></i> Mantenimientos
            </a>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li><a class="dropdown-item small" th:href="@{/admin/productos}">Productos</a></li>
            </ul>
          </div>

          <a class="nav-link text-secondary small text-uppercase fw-semibold" th:href="@{/admin/pedidos}">
            <i class="bi bi-receipt me-1"></i> Pedidos
          </a>

          <a class="nav-link text-secondary small text-uppercase fw-semibold" th:href="@{/admin/consultas}">
            <i class="bi bi-search me-1"></i> Consultas
          </a>

          <!-- Opción Separada: Postventa y Garantías -->
          <a class="nav-link text-secondary small text-uppercase fw-semibold" th:href="@{/admin/postventa}">
            <i class="bi bi-shield-check me-1 text-warning"></i> Postventa
          </a>

          <a class="nav-link text-secondary small text-uppercase fw-semibold" th:href="@{/admin/reportes}">
            <i class="bi bi-graph-up me-1"></i> Reportes
          </a>
        </nav>
      </div>

      <!-- Menú Derecho -->
      <div class="d-flex align-items-center gap-3">
        <a th:href="@{/catalogo}" class="btn btn-outline-secondary btn-sm small d-flex align-items-center gap-1" target="_blank">
          <i class="bi bi-shop"></i> Ver tienda
        </a>

        <span class="text-secondary small fw-semibold">• SESIONES: 1</span>

        <div class="d-flex align-items-center gap-2 border border-secondary border-opacity-50 px-3 py-1 rounded bg-black">
          <i class="bi bi-person-circle text-warning fs-5"></i>
          <span class="text-light small fw-bold" th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre : 'ADMIN RUDESTYLE'}"></span>
          <span class="badge bg-warning text-black fw-bold" style="font-size: 0.65rem;">ADMIN</span>
          <a th:href="@{/logout}" class="text-danger ms-2" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right fs-5"></i>
          </a>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
