<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="navbar" class="rs-navbar-wrapper sticky-top">
    <!-- Barra superior informativa -->
    <div class="rs-top-bar d-none d-md-block">
      <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4 text-secondary small">
          <span><i class="bi bi-geo-alt me-1"></i> Lima, Callao — Perú</span>
          <span><i class="bi bi-telephone me-1"></i> +51 999 888 777</span>
        </div>
        <div class="text-secondary small">
          <span><i class="bi bi-shield-check text-warning me-1"></i> Envíos gratis por compras desde S/. 150</span>
        </div>
      </div>
    </div>

    <!-- Navegación Principal -->
    <nav class="navbar navbar-expand-lg rs-navbar">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand rs-logo" th:href="@{/}">
          <span class="text-light fw-black">RUDE</span><span class="text-warning fw-black">STYLE</span>
        </a>

        <button class="navbar-toggler text-light border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <i class="bi bi-list fs-3"></i>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <!-- Enlaces Centrales -->
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
            <li class="nav-item">
              <a class="nav-link rs-nav-link" th:href="@{/}">INICIO</a>
            </li>
            <li class="nav-item">
              <a class="nav-link rs-nav-link" th:href="@{/catalogo}">CATÁLOGO</a>
            </li>
            <li class="nav-item">
              <a class="nav-link rs-nav-link" th:href="@{/nosotros}">NOSOTROS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link rs-nav-link" th:href="@{/contacto}">CONTACTO</a>
            </li>

            <!-- Acceso exclusivo para Administrador -->
            <li class="nav-item" th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol != null and #strings.contains(session.usuarioLogueado.rol, 'ADMIN')}">
              <a class="nav-link text-warning fw-bold d-flex align-items-center gap-1" th:href="@{/admin/pedidos}">
                <i class="bi bi-speedometer2"></i> PANEL ADMIN
              </a>
            </li>
          </ul>

          <!-- Botones de Acción / Carrito / Usuario -->
          <div class="d-flex align-items-center gap-3">
            <!-- Botón Carrito -->
            <a th:href="@{/carrito}" class="nav-btn-gold">
              <i class="bi bi-bag"></i> Carrito
            </a>

            <!-- Si NO ha iniciado sesión -->
            <a th:if="${session.usuarioLogueado == null}" th:href="@{/login}" class="nav-btn-outline">
              <i class="bi bi-person"></i> Ingresar
            </a>

            <!-- Si YA inició sesión -->
            <div th:if="${session.usuarioLogueado != null}" class="d-flex align-items-center gap-2 border border-secondary border-opacity-50 px-3 py-1 rounded bg-black">
              <a th:href="@{/mis-pedidos}" class="text-decoration-none d-flex align-items-center gap-2" title="Ver mis pedidos">
                <i class="bi bi-person-circle text-warning fs-5"></i>
                <span class="text-light small fw-bold" th:text="${session.usuarioLogueado.nombre}">Usuario</span>
              </a>
              <a th:href="@{/logout}" class="text-danger ms-2" title="Cerrar sesión">
                <i class="bi bi-box-arrow-right fs-5"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>
</body>
</html>
