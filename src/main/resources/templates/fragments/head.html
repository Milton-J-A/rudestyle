<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RudeStyle — Ropa & Accesorios</title>
  
  <!-- Bootstrap 5 y Bootstrap Icons vía CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  
  <style>
    :root {
      --rs-black:  #0d0d0d;
      --rs-dark:   #161616;
      --rs-card:   #1a1a1a;
      --rs-gold:   #c9a84c;
      --rs-gold2:  #e0ba5a;
      --rs-light:  #f0f0f0;
      --rs-muted:  #888;
      --rs-border: #2a2a2a;
    }

    * { box-sizing: border-box; }
    body { background: var(--rs-dark); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }

    /* Topbar */
    .rs-topbar { background: var(--rs-black); border-bottom: 1px solid var(--rs-border); font-size: .72rem; letter-spacing: .5px; color: #777; padding: .35rem 0; }
    .rs-topbar span { color: #aaa; }
    .rs-topbar i { color: var(--rs-gold); }

    /* Navbar */
    .rs-navbar { background: var(--rs-black) !important; border-bottom: 1px solid var(--rs-border); padding: .6rem 0; }
    .rs-brand  { font-size: 1.5rem; font-weight: 900; letter-spacing: 4px; color: #fff !important; text-decoration: none; }
    .rs-brand span { color: var(--rs-gold); }
    .rs-navbar .nav-link { color: #bbb !important; letter-spacing: 1px; font-size: .82rem; text-transform: uppercase; transition: color .2s; padding: .4rem .8rem; }
    .rs-navbar .nav-link:hover { color: var(--rs-gold) !important; }
    .rs-search { background: #1e1e1e; border: 1px solid #333; border-radius: 0; color: #fff; font-size: .85rem; }
    .rs-search:focus { background: #1e1e1e; border-color: var(--rs-gold); color: #fff; box-shadow: none; }
    .rs-search::placeholder { color: #555; }
    .rs-search-btn { background: var(--rs-gold); border: none; border-radius: 0; color: #000; padding: .375rem .9rem; }
    .rs-search-btn:hover { background: var(--rs-gold2); }
    .rs-icon-btn { background: none; border: 1px solid #333; color: #bbb; border-radius: 0; padding: .375rem .65rem; font-size: 1rem; transition: all .2s; }
    .rs-icon-btn:hover { border-color: var(--rs-gold); color: var(--rs-gold); }
    .rs-cart-btn { background: var(--rs-gold); color: #000 !important; border-radius: 0; font-weight: 700; font-size: .82rem; letter-spacing: 1px; padding: .4rem 1rem; position: relative; }
    .rs-cart-btn:hover { background: var(--rs-gold2); }
    .rs-btn-login { background: transparent; border: 1px solid #444; color: #bbb !important; border-radius: 0; font-size: .78rem; letter-spacing: 1px; padding: .4rem .9rem; transition: all .2s; }
    .rs-btn-login:hover { border-color: var(--rs-gold); color: var(--rs-gold) !important; }

    /* Carousel */
    .rs-carousel { background: var(--rs-black); }
    .rs-slide { min-height: 460px; display: flex; align-items: center; position: relative; overflow: hidden; }
    .rs-slide-img { position: absolute; right: 0; top: 0; height: 100%; width: 55%; object-fit: cover; opacity: .7; }
    .rs-slide-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,13,13,1) 35%, rgba(13,13,13,.4) 65%, transparent 100%); }
    .rs-slide-content { position: relative; z-index: 2; padding: 0 5%; max-width: 600px; }
    .rs-slide-tag { font-size: .7rem; letter-spacing: 3px; text-transform: uppercase; color: var(--rs-gold); background: rgba(201,168,76,.1); border: 1px solid rgba(201,168,76,.3); padding: .3rem .8rem; display: inline-block; margin-bottom: 1rem; }
    .rs-slide-title { font-size: clamp(2rem,4.5vw,3.8rem); font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: #fff; line-height: 1.05; margin-bottom: 1rem; }
    .rs-slide-sub { font-size: .9rem; color: #aaa; margin-bottom: 1.5rem; line-height: 1.6; }
    .rs-carousel .carousel-indicators [data-bs-target] { width: 24px; height: 3px; border-radius: 0; background: #444; opacity: 1; }
    .rs-carousel .carousel-indicators .active { background: var(--rs-gold); width: 40px; }
    .rs-carousel .carousel-control-prev,
    .rs-carousel .carousel-control-next { width: 44px; height: 44px; background: rgba(255,255,255,.06); border: 1px solid #333; border-radius: 0; top: 50%; transform: translateY(-50%); opacity: 1; }
    .rs-carousel .carousel-control-prev { left: 16px; }
    .rs-carousel .carousel-control-next { right: 16px; }

    /* Botones */
    .rs-btn-primary { background: var(--rs-gold); color: #000; border: none; border-radius: 0; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: .7rem 2rem; transition: background .2s; display: inline-block; text-decoration: none; cursor: pointer; }
    .rs-btn-primary:hover { background: var(--rs-gold2); color: #000; }
    .rs-btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.4); border-radius: 0; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: .65rem 1.8rem; transition: all .2s; display: inline-block; text-decoration: none; }
    .rs-btn-outline:hover { background: #fff; color: #000; border-color: #fff; }

    /* Category pills */
    .cat-pill { background: var(--rs-card); border: 1px solid var(--rs-border); border-radius: 0; font-size: .75rem; letter-spacing: 1px; text-transform: uppercase; color: #999; padding: .5rem 1.1rem; transition: all .2s; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; }
    .cat-pill:hover, .cat-pill.active { background: var(--rs-gold); color: #000; border-color: var(--rs-gold); font-weight: 700; }
    .cat-pill .badge { background: rgba(255,255,255,.1); color: #aaa; font-size: .65rem; padding: .2em .5em; border-radius: 2px; }
    .cat-pill.active .badge { background: rgba(0,0,0,.2); color: #000; }

    /* Product card */
    .product-card { background: var(--rs-card); border: 1px solid var(--rs-border); border-radius: 0; overflow: hidden; cursor: pointer; transition: transform .3s, box-shadow .3s, border-color .3s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,.5) !important; border-color: #3a3a3a; }
    .product-img-wrap { position: relative; overflow: hidden; aspect-ratio: 3/4; background: #111; }
    .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
    .product-card:hover .product-img-wrap img { transform: scale(1.06); }
    .product-overlay { position: absolute; bottom: -56px; left: 0; right: 0; padding: 8px; transition: bottom .3s; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
    .product-card:hover .product-overlay { bottom: 0; }
    .product-overlay a { display: block; width: 100%; border-radius: 0; font-size: .75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: .55rem; text-align: center; background: var(--rs-gold); color: #000; text-decoration: none; transition: background .2s; }
    .product-overlay a:hover { background: var(--rs-gold2); }
    .badge-new { background: #2a9d5c; color: #fff; font-size: .65rem; letter-spacing: 1px; text-transform: uppercase; padding: .28em .7em; border-radius: 0; }
    .badge-discount { background: #e03e3e; color: #fff; font-size: .65rem; letter-spacing: 1px; text-transform: uppercase; padding: .28em .7em; border-radius: 0; }
    .badge-cat { background: rgba(201,168,76,.15); color: var(--rs-gold); font-size: .65rem; letter-spacing: 1px; border-radius: 0; padding: .25em .6em; text-transform: uppercase; }
    .product-brand { font-size: .7rem; color: var(--rs-muted); letter-spacing: 1px; text-transform: uppercase; }
    .product-name { font-size: .88rem; font-weight: 700; color: #e0e0e0; line-height: 1.3; }
    .price-tag { font-size: 1.1rem; font-weight: 800; color: var(--rs-gold); }
    .price-old { font-size: .8rem; color: #555; text-decoration: line-through; }
    .stock-info { font-size: .72rem; color: #4caf50; }

    /* Section titles */
    .rs-section-title { font-size: .72rem; letter-spacing: 4px; color: var(--rs-gold); text-transform: uppercase; margin-bottom: .4rem; }
    .rs-section-h2 { font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #fff; margin-bottom: 0; }

    /* Footer */
    .rs-footer { background: var(--rs-black); color: #666; border-top: 1px solid var(--rs-border); }
    .rs-footer .footer-brand { font-size: 1.3rem; font-weight: 900; letter-spacing: 4px; color: #fff; }
    .rs-footer .footer-brand span { color: var(--rs-gold); }
    .rs-footer h6 { color: #ccc; font-size: .7rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 1rem; }
    .rs-footer a { color: #666; text-decoration: none; font-size: .82rem; transition: color .2s; line-height: 2; display: block; }
    .rs-footer a:hover { color: var(--rs-gold); }
    .rs-footer hr { border-color: var(--rs-border); }
    .rs-footer-social a { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid #333; color: #666; font-size: .9rem; transition: all .2s; text-decoration: none; }
    .rs-footer-social a:hover { border-color: var(--rs-gold); color: var(--rs-gold); background: rgba(201,168,76,.08); }
  </style>
</head>
<body></body>
</html>
