<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="navbar" class="rs-navbar-wrapper sticky-top">
    <!-- Barra superior informativa -->
    <div class="rs-top-bar d-none d-md-block">
      <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4 text-secondary small">
          <span><i class="bi bi-geo-alt me-1"></i> Lima, Callao — Perú</span>
          <span><i class="bi bi-telephone me-1"></i> +51 999 888 777</span>
        </div>
        <div class="text-secondary small">
          <span><i class="bi bi-shield-check text-warning me-1"></i> Envíos gratis por compras desde S/. 150</span>
        </div>
      </div>
    </div>

    <!-- Navegación Principal -->
    <nav class="navbar navbar-expand-lg rs-navbar">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand rs-logo" th:href="@{/}">
          <span class="text-light fw-black">RUDE</span><span class="text-warning fw-black">STYLE</span>
        </a>

        <button class="navbar-toggler text-light border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <i class="bi bi-list fs-3"></i>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <!-- Enlaces Centrales -->
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
            <li class="nav-item">
              <a class="nav-link rs-nav-link" th:href="@{/}">INICIO</a>
            </li>
            <li class="nav-item">
              <a class="nav-link rs-nav-link" th:href="@{/catalogo}">CATÁLOGO</a>
            </li>
            <li class="nav-item">
              <a class="nav-link rs-nav-link" th:href="@{/nosotros}">NOSOTROS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link rs-nav-link" th:href="@{/contacto}">CONTACTO</a>
            </li>

            <!-- Acceso exclusivo para Administrador -->
            <li class="nav-item" th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol != null and #strings.contains(session.usuarioLogueado.rol, 'ADMIN')}">
              <a class="nav-link text-warning fw-bold d-flex align-items-center gap-1" th:href="@{/admin/pedidos}">
                <i class="bi bi-speedometer2"></i> PANEL ADMIN
              </a>
            </li>
          </ul>

          <!-- Botones de Acción / Carrito / Usuario -->
          <div class="d-flex align-items-center gap-3">
            <!-- Botón Carrito -->
            <a th:href="@{/carrito}" class="nav-btn-gold">
              <i class="bi bi-bag"></i> Carrito
            </a>

            <!-- Si NO ha iniciado sesión -->
            <a th:if="${session.usuarioLogueado == null}" th:href="@{/login}" class="nav-btn-outline">
              <i class="bi bi-person"></i> Ingresar
            </a>

            <!-- Si YA inició sesión: Menú Desplegable de Usuario -->
            <div th:if="${session.usuarioLogueado != null}" class="dropdown">
              <button class="btn btn-outline-warning dropdown-toggle d-flex align-items-center gap-2 py-1 px-3 rounded text-white border-secondary fw-semibold bg-black" 
                      type="button" 
                      id="dropdownUsuarioMenu" 
                      data-bs-toggle="dropdown" 
                      aria-expanded="false">
                <i class="bi bi-person-circle text-warning fs-5"></i>
                <span th:text="${session.usuarioLogueado.nombre}">Usuario</span>
              </button>

              <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg py-2 mt-2" 
                  aria-labelledby="dropdownUsuarioMenu"
                  style="min-width: 230px; background-color: #161616; border: 1px solid #333; border-radius: 8px;">
                
                <li class="px-3 py-2 border-bottom border-secondary border-opacity-25">
                  <small class="text-secondary d-block" style="font-size: 0.72rem; letter-spacing: 0.5px;">MI CUENTA</small>
                  <span class="text-warning fw-bold small text-truncate d-block" th:text="${session.usuarioLogueado.nombre}">Usuario</span>
                </li>

                <!-- 1. Mis Pedidos & Comprobantes -->
                <li>
                  <a class="dropdown-item d-flex align-items-center gap-2 py-2 text-light" th:href="@{/mis-pedidos}">
                    <i class="bi bi-bag-check text-warning"></i>
                    <span>Mis Pedidos</span>
                  </a>
                </li>

                <!-- 2. Mis Reclamos & Garantías -->
                <li>
                  <a class="dropdown-item d-flex align-items-center gap-2 py-2 text-light" th:href="@{/mis-reclamos}">
                    <i class="bi bi-shield-check text-info"></i>
                    <span>Mis Reclamos / Garantías</span>
                  </a>
                </li>

                <li><hr class="dropdown-divider border-secondary border-opacity-25 my-1"></li>

                <!-- 3. Cerrar Sesión -->
                <li>
                  <a class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger fw-semibold" th:href="@{/logout}">
                    <i class="bi bi-box-arrow-right text-danger"></i>
                    <span>Cerrar Sesión</span>
                  </a>
                </li>
              </ul>
            </div>

          </div>
        </div>
      </div>
    </nav>
    <!-- Script autónomo para asegurar la apertura del dropdown de usuario -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const dropBtn = document.getElementById("dropdownUsuarioMenu");
        if (dropBtn) {
          const dropMenu = dropBtn.nextElementSibling;
          dropBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            dropMenu.classList.toggle("show");
          });
          document.addEventListener("click", function (e) {
            if (!dropBtn.contains(e.target) && !dropMenu.contains(e.target)) {
              dropMenu.classList.remove("show");
            }
          });
        }
      });
    </script>
  </header>
</body>
</html>
