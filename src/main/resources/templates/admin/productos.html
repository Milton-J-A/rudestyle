<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-black text-light">

  <!-- Navbar dedicado del Administrador -->
  <div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

  <div class="container-fluid px-4 py-4" style="min-height: 85vh;">
    <!-- Encabezado de la página -->
    <div class="mb-4">
      <div class="text-warning text-uppercase small fw-bold" style="letter-spacing: 2px;">
        <i class="bi bi-gear-fill me-1"></i> Mantenimiento
      </div>
      <h2 class="text-light fw-black mb-0">PRODUCTOS</h2>
    </div>

    <!-- Layout en 2 Columnas -->
    <div class="row g-4">
      
      <!-- Columna Izquierda: Formulario (Nuevo / Editar Producto) -->
      <div class="col-lg-4 col-xl-3">
        <div class="bg-dark p-3 rounded border border-secondary border-opacity-25 shadow-sm sticky-top" style="top: 80px;">
          <div class="text-warning text-uppercase small fw-bold mb-3 d-flex align-items-center gap-2">
            <i class="bi bi-plus-circle"></i>
            <span th:text="${esEdicion ? 'Editar Producto' : 'Nuevo Producto'}"></span>
          </div>

          <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post">
            <input type="hidden" th:field="*{idProducto}">

            <div class="mb-3">
              <input type="text" th:field="*{nomProducto}" class="form-control bg-black text-light border-secondary small" 
                     placeholder="Nombre del producto" required>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <input type="number" step="0.01" th:field="*{precio}" class="form-control bg-black text-light border-secondary small" 
                       placeholder="Precio (S/.)" required>
              </div>
              <div class="col-6">
                <input type="number" th:field="*{stock}" class="form-control bg-black text-light border-secondary small" 
                       placeholder="Stock" required>
              </div>
            </div>

            <div class="mb-3">
              <select th:field="*{categoria}" class="form-select bg-black text-light border-secondary small" required>
                <option value="">-- Seleccione --</option>
                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nomCategoria}"></option>
              </select>
            </div>

            <div class="mb-3">
              <input type="text" th:field="*{tallasDisponibles}" class="form-control bg-black text-light border-secondary small" 
                     placeholder="Tallas (ej: S,M,L,XL)">
            </div>

            <div class="mb-3">
              <input type="text" th:field="*{imagen}" class="form-control bg-black text-light border-secondary small" 
                     placeholder="Nombre del archivo (ej: terno-elegante.jpg)">
            </div>

            <div class="mb-3">
              <textarea th:field="*{descripcion}" class="form-control bg-black text-light border-secondary small" 
                        rows="3" placeholder="Descripción"></textarea>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" th:field="*{destacado}" id="checkDest">
              <label class="form-check-label text-secondary small" for="checkDest">Marcar como Destacado</label>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-warning text-black fw-bold w-100 py-2 text-uppercase small">
                <i class="bi bi-check-lg me-1"></i> Guardar
              </button>
              <a th:if="${esEdicion}" th:href="@{/admin/productos}" class="btn btn-outline-secondary py-2 small">
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>

      <!-- Columna Derecha: Tabla Lista de Productos -->
      <div class="col-lg-8 col-xl-9">
        <div class="bg-dark p-3 rounded border border-secondary border-opacity-25 shadow-sm">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="text-warning text-uppercase small fw-bold d-flex align-items-center gap-2">
              <i class="bi bi-list-ul"></i> Lista de Productos
            </div>
            <span class="text-secondary small fw-bold" th:text="${totalRegistros} + ' REGISTROS'"></span>
          </div>

          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0">
              <thead>
                <tr class="text-secondary small text-uppercase border-secondary">
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Precio</th>
                  <th class="text-center">Stock</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="p : ${productos}" class="border-secondary small">
                  <td class="text-secondary" th:text="'#' + ${p.idProducto}"></td>
                  <td>
                    <span class="text-light fw-bold" th:text="${p.nomProducto}"></span>
                  </td>
                  <td>
                    <span class="text-secondary" th:text="${p.categoria != null ? p.categoria.nomCategoria : 'Sin Asignar'}"></span>
                  </td>
                  <td class="text-warning fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                  <td class="text-center">
                    <span class="badge bg-success-subtle text-success px-2 py-1" th:text="${p.stock}"></span>
                  </td>
                  <td class="text-end">
                    <div class="d-inline-flex gap-1">
                      <a th:href="@{'/admin/productos/editar/' + ${p.idProducto}}" class="btn btn-outline-warning btn-sm py-0 px-2" title="Editar">
                        <i class="bi bi-pencil small"></i>
                      </a>
                      <a th:href="@{'/admin/productos/eliminar/' + ${p.idProducto}}" 
                         class="btn btn-outline-danger btn-sm py-0 px-2" 
                         onclick="return confirm('¿Seguro que deseas eliminar este producto?');" 
                         title="Eliminar">
                        <i class="bi bi-trash small"></i>
                      </a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
