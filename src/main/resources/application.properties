# Puerto del servidor web
server.port=8085

# Conexion a MySQL Server para BD_RudeStyle
spring.datasource.url=jdbc:mysql://localhost:3306/bd_rudestyle?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Mja1998gohann
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate (Dialecto explicito para evitar el error)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar cache de Thymeleaf para pruebas en caliente
spring.thymeleaf.cache=false